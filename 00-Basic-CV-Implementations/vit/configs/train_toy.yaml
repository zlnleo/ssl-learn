# 象限亮块任务配置（离线快速自检）
# 用法：python train_v5_hydra.py dataset=toy      —— 命令行切到本配置
# 也可以：python train_v5_hydra.py --config-name train_toy
dataset: toy
data_dir: "../../data"
epochs: 30
batch_size: 32
lr: 1e-3
weight_decay: 0.05
grad_clip: 1.0
num_workers: 0            # toy 数据在内存里，不需要多进程
seed: 42
embed_size: 64
num_heads: 4
num_layers: 2
dropout: 0.1
amp: true
ckpt_dir: "./checkpoint"
resume: false
log_dir: "./runs"
