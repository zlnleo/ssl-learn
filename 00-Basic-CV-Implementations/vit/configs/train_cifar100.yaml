# CIFAR-100 训练配置（默认配置）
# 用法：python train_v5_hydra.py                —— 用本文件
#       python train_v5_hydra.py epochs=5      —— 命令行覆盖任意字段
dataset: cifar100
data_dir: "../../data"      # 相对项目根（train_v5_hydra.py 会自动解析）
epochs: 100
batch_size: 128
lr: 1e-3
weight_decay: 0.05
grad_clip: 1.0
num_workers: 2
seed: 42
embed_size: 192
num_heads: 6
num_layers: 6
dropout: 0.1
amp: true                   # GPU 上混合精度
patience: 10                # 早停耐心值：验证准确率连续多少轮不创新高就停止
ckpt_dir: "./checkpoint"
resume: false
log_dir: "./runs"
